name: Private Momentum AI compile on public runner
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/private-momentum-ai-build.yml'
permissions:
  contents: read
jobs:
  custom-firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check private source credential
        env:
          PRIVATE_TOKEN: ${{ secrets.FLIPPER_PRIVATE_SOURCE_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::Configure repository secret FLIPPER_PRIVATE_SOURCE_TOKEN with read-only Contents access to the private firmware repository."
            exit 1
          fi
      - name: Require encrypted delivery secret before building
        env:
          DELIVERY_PASSPHRASE: ${{ secrets.FLIPPER_ARTIFACT_PASSPHRASE }}
        run: |
          if [ "${#DELIVERY_PASSPHRASE}" -lt 20 ]; then
            echo "::error::Set FLIPPER_ARTIFACT_PASSPHRASE to a unique random passphrase of at least 20 characters; no plaintext firmware will be uploaded."
            exit 1
          fi
      - name: Checkout public test harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test native updater packaging with synthetic fixtures
        run: python3 -m unittest discover -s tests -p 'test_momentum_flash_package.py' -v
      - name: Fetch private AI source without persisting credentials
        env:
          PRIVATE_TOKEN: ${{ secrets.FLIPPER_PRIVATE_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'machine github.com login x-access-token password %s\n' "$PRIVATE_TOKEN" > "$RUNNER_TEMP/private.netrc"
          chmod 600 "$RUNNER_TEMP/private.netrc"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0=
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/bin/false
          export HOME="$RUNNER_TEMP"
          mv "$RUNNER_TEMP/private.netrc" "$HOME/.netrc"
          trap 'rm -f "$HOME/.netrc"' EXIT
          git -c http.extraheader= clone --quiet --depth 1 --branch feature/flash-test-platform-v01 \
            https://github.com/cruefan94/Flipper-AI-Momentum-.git "$RUNNER_TEMP/private-ai"
          test -f "$RUNNER_TEMP/private-ai/momentum_overlay/install_source_overlay.py"
      - name: Identify private firmware source revision
        run: git -C "$RUNNER_TEMP/private-ai" rev-parse HEAD
      - name: Verify private firmware GATT UUIDs and authenticated characteristic roles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'private-ai/momentum_overlay/targets/f7/ble_glue/services/ai_satellite_service.c'
          source=p.read_text()
          expected={
              'SERVICE':'c8c7ab10-6355-4ea8-a76a-0a4a64de0001',
              'RX':'c8c7ab10-6355-4ea8-a76a-0a4a64de0002',
              'TX':'c8c7ab10-6355-4ea8-a76a-0a4a64de0003',
          }
          for key,uuid in expected.items():
              if f'{key}: ' not in source or uuid not in source:
                  raise SystemExit(f'Missing expected {key} UUID')
          for token in ('AI_UUID_BASE(0x01)', 'AI_UUID_BASE(0x02)', 'AI_UUID_BASE(0x03)',
                        'CHAR_PROP_WRITE', 'CHAR_PROP_NOTIFY', 'ATTR_PERMISSION_AUTHEN_WRITE',
                        'ATTR_PERMISSION_AUTHEN_READ', 'AI_SVC_MAX_FRAME 180u'):
              if token not in source: raise SystemExit(f'Firmware GATT contract missing {token}')
          print('Private firmware GATT roles and UUIDs match the public AI1 contract')
          PY
      - name: Clone pinned upstream Momentum
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/Next-Flip/Momentum-Firmware.git "$RUNNER_TEMP/momentum-fw"
          git -C "$RUNNER_TEMP/momentum-fw" checkout --quiet --detach d3f89dfe2ef6b01839201598e9be1590cba80322
      - name: Private overlay source and Python unit tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-ai"
          python3 -m py_compile momentum_overlay/install_source_overlay.py momentum_overlay/install_trusted_gap_hook.py momentum_overlay/install_bt_ai_api.py momentum_overlay/mark_internal_api.py scripts/patch_app.py
          python3 -m unittest discover -s momentum_overlay/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tests -p 'test_ble_ui_guards.py' -v
      - name: Apply AI source overlays
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-ai"
          python3 momentum_overlay/install_source_overlay.py "$RUNNER_TEMP/momentum-fw"
          python3 momentum_overlay/install_trusted_gap_hook.py "$RUNNER_TEMP/momentum-fw"
          python3 momentum_overlay/install_bt_ai_api.py "$RUNNER_TEMP/momentum-fw"
          python3 momentum_overlay/mark_internal_api.py "$RUNNER_TEMP/momentum-fw/targets/f7/api_symbols.csv"
          python3 scripts/patch_app.py "$RUNNER_TEMP/momentum-fw" --mode internal --autostart no --ble-experimental
      - name: Normalize upstream Git version metadata parser for CI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path(__import__('os').environ['RUNNER_TEMP']) / 'momentum-fw/scripts/version.py'
          src = p.read_text()
          old = 'url, _ = destination.split(" ")'
          new = 'url, _ = destination.rsplit(" ", 1)'
          if src.count(old) != 1:
              raise SystemExit('Upstream Git metadata parser changed; refusing blind patch')
          p.write_text(src.replace(old, new, 1))
          print('Applied CI-only remote URL parser compatibility fix')
          PY
      - name: Compile custom Momentum AI firmware
        working-directory: ${{ runner.temp }}/momentum-fw
        run: |
          set -euo pipefail
          ./fbt TARGET_HW=7 COMPACT=1 copro_dist updater_package fap_dist -j2
      - name: Verify native Momentum .tgz and encrypt phone-ready package
        env:
          DELIVERY_PASSPHRASE: ${{ secrets.FLIPPER_ARTIFACT_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/prepare_momentum_flash_package.py pack \
            --dist "$RUNNER_TEMP/momentum-fw/dist/f7-C" \
            --out "$RUNNER_TEMP/firmware-delivery" \
            --source-revision "$(git -C "$RUNNER_TEMP/private-ai" rev-parse HEAD)" \
            --momentum-revision "$(git -C "$RUNNER_TEMP/momentum-fw" rev-parse HEAD)"
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/firmware-delivery/flipper-ai-native-tgz-delivery.tar.gz" \
            -out "$RUNNER_TEMP/flipper-ai-native-tgz-delivery.tar.gz.enc" \
            -pass env:DELIVERY_PASSPHRASE
          test -s "$RUNNER_TEMP/flipper-ai-native-tgz-delivery.tar.gz.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/flipper-ai-native-tgz-delivery.tar.gz.enc" \
            -out "$RUNNER_TEMP/firmware-delivery/roundtrip.tar.gz" \
            -pass env:DELIVERY_PASSPHRASE
          cmp "$RUNNER_TEMP/firmware-delivery/flipper-ai-native-tgz-delivery.tar.gz" \
              "$RUNNER_TEMP/firmware-delivery/roundtrip.tar.gz"
          python3 scripts/prepare_momentum_flash_package.py verify \
            --archive "$RUNNER_TEMP/firmware-delivery/roundtrip.tar.gz"
          rm -rf "$RUNNER_TEMP/firmware-delivery"
          echo "Native Momentum F7 .tgz validated, encrypted, and plaintext removed."
      - name: Upload encrypted firmware package only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-flipper-ai-mobile-native-tgz-UNTESTED
          path: ${{ runner.temp }}/flipper-ai-native-tgz-delivery.tar.gz.enc
          if-no-files-found: error
          retention-days: 7
      - name: Report verified scope without publishing private binaries
        run: |
          echo "Custom AI Momentum firmware compiled; native mobile F7 .tgz checked."
          echo "Only encrypted delivery artifact uploaded, not plaintext firmware or private source; physical flash untested."
