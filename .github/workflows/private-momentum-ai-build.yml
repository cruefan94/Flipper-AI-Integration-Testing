# Re-run after adding two new read-only API symbols to pinned private SDK mask; encrypted output only.
name: Audited Momentum ESP32 GATT F7 firmware and encrypted next-flash candidate
on:
  workflow_call:
    secrets:
      FLIPPER_PRIVATE_SOURCE_TOKEN:
        required: true
      FLIPPER_ARTIFACT_PASSPHRASE:
        required: true
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/private-momentum-ai-build.yml'
      - 'scripts/prepare_unified_esp32_release.py'
      - 'tests/test_unified_esp32_release.py'
permissions:
  contents: read
jobs:
  custom-firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check private source credential
        env:
          PRIVATE_TOKEN: ${{ secrets.FLIPPER_PRIVATE_SOURCE_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::Configure repository secret FLIPPER_PRIVATE_SOURCE_TOKEN with read-only Contents access to the private firmware repository."
            exit 1
          fi
      - name: Require encrypted delivery secret before building
        env:
          DELIVERY_PASSPHRASE: ${{ secrets.FLIPPER_ARTIFACT_PASSPHRASE }}
        run: |
          if [ "${#DELIVERY_PASSPHRASE}" -lt 20 ]; then
            echo "::error::Set FLIPPER_ARTIFACT_PASSPHRASE to a unique random passphrase of at least 20 characters; no plaintext firmware will be uploaded."
            exit 1
          fi
      - name: Checkout public test harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test firmware and GPL programmer delivery using public synthetic fixtures
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_momentum_flash_package.py' -v
          python3 -m unittest discover -s tests -p 'test_esp_flasher_delivery.py' -v
          python3 -m unittest discover -s tests -p 'test_unified_esp32_release.py' -v
      - name: Fetch private AI source without persisting credentials
        env:
          PRIVATE_TOKEN: ${{ secrets.FLIPPER_PRIVATE_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'machine github.com login x-access-token password %s\n' "$PRIVATE_TOKEN" > "$RUNNER_TEMP/private.netrc"
          chmod 600 "$RUNNER_TEMP/private.netrc"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0=
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/bin/false
          export HOME="$RUNNER_TEMP"
          mv "$RUNNER_TEMP/private.netrc" "$HOME/.netrc"
          trap 'rm -f "$HOME/.netrc"' EXIT
          git -c http.extraheader= clone --quiet --depth 1 --branch audit/installer-preflight-and-code-gates-20261115 \
            https://github.com/cruefan94/Flipper-AI-Momentum-.git "$RUNNER_TEMP/private-ai"
          test -f "$RUNNER_TEMP/private-ai/momentum_overlay/install_source_overlay.py"
          test "$(git -C "$RUNNER_TEMP/private-ai" rev-parse HEAD)" = "0cc9404d2d541af11921367c2a5639c9ed8fdb77" || {
            echo "::error::Unified private source moved; review new revision before compiling."
            exit 1
          }
      - name: Identify private firmware source revision
        run: git -C "$RUNNER_TEMP/private-ai" rev-parse HEAD
      - name: Verify private firmware GATT UUIDs and authenticated characteristic roles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'private-ai/momentum_overlay/targets/f7/ble_glue/services/ai_satellite_service.c'
          source=p.read_text()
          expected={
              'SERVICE':'c8c7ab10-6355-4ea8-a76a-0a4a64de0001',
              'RX':'c8c7ab10-6355-4ea8-a76a-0a4a64de0002',
              'TX':'c8c7ab10-6355-4ea8-a76a-0a4a64de0003',
          }
          for key,uuid in expected.items():
              if f'{key}: ' not in source or uuid not in source:
                  raise SystemExit(f'Missing expected {key} UUID')
          for token in ('AI_UUID_BASE(0x01)', 'AI_UUID_BASE(0x02)', 'AI_UUID_BASE(0x03)',
                        'CHAR_PROP_WRITE', 'CHAR_PROP_NOTIFY', 'ATTR_PERMISSION_AUTHEN_WRITE',
                        'ATTR_PERMISSION_AUTHEN_READ', 'AI_SVC_MAX_FRAME 180u'):
              if token not in source: raise SystemExit(f'Firmware GATT contract missing {token}')
          print('Private firmware GATT roles and UUIDs match the public AI1 contract')
          PY
      - name: Clone pinned upstream Momentum
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/Next-Flip/Momentum-Firmware.git "$RUNNER_TEMP/momentum-fw"
          git -C "$RUNNER_TEMP/momentum-fw" checkout --quiet --detach d3f89dfe2ef6b01839201598e9be1590cba80322
      - name: Private overlay source and Python unit tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-ai"
          python3 -m py_compile momentum_overlay/install_source_overlay.py momentum_overlay/install_trusted_gap_hook.py momentum_overlay/install_bt_ai_api.py momentum_overlay/mark_internal_api.py scripts/patch_app.py
          python3 -m unittest discover -s momentum_overlay/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tests -p 'test_ble_ui_guards.py' -v
          python3 -m unittest discover -s tests -p 'test_local_health_and_ble_guide.py' -v
          python3 -m unittest discover -s tests -p 'test_ai_gatt_registration_diagnostics.py' -v
          python3 -m unittest discover -s tests -p 'test_esp32_main_integration.py' -v
          python3 -m unittest discover -s tests -p 'test_unified_transport_esp32.py' -v
          python3 -m unittest discover -s tests -p 'test_installer_preflight_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_ai_gatt_link_events.py' -v
          python3 -m unittest discover -s tests -p 'test_ai_gatt_rx_payload.py' -v
          python3 -m unittest discover -s tests -p 'test_ai_tx_frame_guard.py' -v
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            momentum_overlay/tests/ai_satellite_session_queue_test.c \
            -o "$RUNNER_TEMP/ai-sat-session-audit"
          "$RUNNER_TEMP/ai-sat-session-audit"
          python3 -m unittest discover -s tests -p 'test_esp32_autodetect_profiles.py' -v
          python3 -m unittest discover -s tests -p 'test_esp32_sd_firmware_plan.py' -v
      - name: Validate private ESP32 component source and Momentum sensor menu
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-ai"
          test -f esp32_component_compat/INTEGRATION_LOCK.md
          python3 esp32_component_compat/scripts/check_compat.py
          python3 -m unittest discover -s esp32_component_compat/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tests -p 'test_esp32_sensor_preload.py' -v
          python3 -m unittest discover -s tests -p 'test_esp32_component_cross_repo.py' -v
          echo 'Private component catalog and Flipper FZ1 menu contracts passed.'
      - name: Compile pinned ESP-WROOM-32 component compatibility reference
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user platformio >/dev/null
          export PATH="$HOME/.local/bin:$PATH"
          pio run -d "$RUNNER_TEMP/private-ai/esp32_component_compat/firmware_example" \
            -e esp32dev >"$RUNNER_TEMP/esp32-component-build-private.log" 2>&1 || {
              echo '::error::Classic ESP32 component firmware build failed. Private compiler output remains on temporary runner.'
              exit 1
            }
          output="$RUNNER_TEMP/private-ai/esp32_component_compat/firmware_example/.pio/build/esp32dev"
          for bin in firmware.bin bootloader.bin partitions.bin; do test -s "$output/$bin"; done
          echo 'Classic ESP32 WROOM-32 reference firmware compiled; NOT board flash verified.'
      - name: Hash, encrypt and roundtrip-check separate ESP32 component candidate
        env:
          DELIVERY_PASSPHRASE: ${{ secrets.FLIPPER_ARTIFACT_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          src="$RUNNER_TEMP/private-ai/esp32_component_compat/firmware_example/.pio/build/esp32dev"
          stage="$RUNNER_TEMP/esp32-component-stage"
          mkdir -p "$stage"
          for f in firmware.bin bootloader.bin partitions.bin; do cp "$src/$f" "$stage/$f"; done
          printf '%s\n' \
            "SOURCE_REVISION=$(git -C "$RUNNER_TEMP/private-ai" rev-parse HEAD)" \
            'BOARD_TARGET=esp32dev (provisional classic ESP-WROOM-32)' \
            'COMPATIBILITY=Source/CI candidate only; chip flash capacity and partition offsets not validated.' \
            'MOMENTUM=Flipper ESP32 Manager is separately compiled in the same candidate; no automatic board flash.' \
            'RESTRICTION=Not for ESP32-S2, Arduino Uno, or any unverified board.' \
            > "$stage/READ_FIRST.txt"
          (cd "$stage" && sha256sum firmware.bin bootloader.bin partitions.bin READ_FIRST.txt > SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c SHA256SUMS.txt)
          tar -C "$stage" -czf "$RUNNER_TEMP/esp32-components-UNTESTED.tar.gz" \
            firmware.bin bootloader.bin partitions.bin READ_FIRST.txt SHA256SUMS.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/esp32-components-UNTESTED.tar.gz" \
            -out "$RUNNER_TEMP/esp32-components-UNTESTED.tar.gz.enc" \
            -pass env:DELIVERY_PASSPHRASE
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/esp32-components-UNTESTED.tar.gz.enc" \
            -out "$RUNNER_TEMP/esp32-components-roundtrip.tar.gz" \
            -pass env:DELIVERY_PASSPHRASE
          cmp "$RUNNER_TEMP/esp32-components-UNTESTED.tar.gz" \
            "$RUNNER_TEMP/esp32-components-roundtrip.tar.gz"
          # Avoid grep -q closing tar's stdout early under pipefail (SIGPIPE).
          tar -tzf "$RUNNER_TEMP/esp32-components-roundtrip.tar.gz" \
            > "$RUNNER_TEMP/esp32-component-members.txt"
          grep -Fx 'firmware.bin' "$RUNNER_TEMP/esp32-component-members.txt" >/dev/null
          rm -rf "$stage"
          rm -f "$RUNNER_TEMP/esp32-components-UNTESTED.tar.gz" \
            "$RUNNER_TEMP/esp32-components-roundtrip.tar.gz"
          echo 'Only the encrypted ESP32 component candidate remains for delivery.'
      - name: Upload encrypted ESP32 component candidate only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-esp32-wroom32-component-compat-NOT-HARDWARE-VERIFIED
          path: ${{ runner.temp }}/esp32-components-UNTESTED.tar.gz.enc
          if-no-files-found: error
          retention-days: 7
      - name: Apply AI source overlays
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-ai"
          python3 momentum_overlay/install_source_overlay.py "$RUNNER_TEMP/momentum-fw"
          python3 momentum_overlay/install_trusted_gap_hook.py "$RUNNER_TEMP/momentum-fw"
          python3 momentum_overlay/install_bt_ai_api.py "$RUNNER_TEMP/momentum-fw"
          python3 momentum_overlay/mark_internal_api.py "$RUNNER_TEMP/momentum-fw/targets/f7/api_symbols.csv"
          python3 scripts/patch_app.py "$RUNNER_TEMP/momentum-fw" --mode internal --autostart no --ble-experimental --esp32-manager
      - name: Normalize upstream Git version metadata parser for CI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path(__import__('os').environ['RUNNER_TEMP']) / 'momentum-fw/scripts/version.py'
          src = p.read_text()
          old = 'url, _ = destination.split(" ")'
          new = 'url, _ = destination.rsplit(" ", 1)'
          if src.count(old) != 1:
              raise SystemExit('Upstream Git metadata parser changed; refusing blind patch')
          p.write_text(src.replace(old, new, 1))
          print('Applied CI-only remote URL parser compatibility fix')
          PY
      - name: Compile custom Momentum AI firmware
        working-directory: ${{ runner.temp }}/momentum-fw
        run: |
          set -euo pipefail
          ./fbt TARGET_HW=7 COMPACT=1 copro_dist updater_package fap_dist -j2
      - name: Validate upstream GPL ESP Flasher compiles against this exact Momentum SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --recurse-submodules \
            https://github.com/0xchocolate/flipperzero-esp-flasher.git "$RUNNER_TEMP/esp-flasher-upstream"
          test "$(git -C "$RUNNER_TEMP/esp-flasher-upstream" rev-parse HEAD)" = "1f6f801c3ebecbc4afbf6500564bf99748710e24" || {
            echo "::error::Upstream ESP Flasher commit changed; review before building."
            exit 1
          }
          grep -qi 'GNU GENERAL PUBLIC LICENSE' "$RUNNER_TEMP/esp-flasher-upstream/LICENSE"
          test -s "$RUNNER_TEMP/esp-flasher-upstream/lib/esp-serial-flasher/src/esp_loader.c"
          # Fetch a reviewable GPL-3.0 patch at an immutable public commit;
          # the patched app must verify chip MD5 after writing each image.
          curl -fLsS \
            "https://raw.githubusercontent.com/cruefan94/Flipper-AI-Integration-Testing/b23336cd70984daac99d05568504ebccef8c1698/hardware-installer/patch_esp_flasher_verify.py" \
            -o "$RUNNER_TEMP/patch_esp_flasher_verify.py"
          python3 "$RUNNER_TEMP/patch_esp_flasher_verify.py" "$RUNNER_TEMP/esp-flasher-upstream"
          grep -q "err = esp_loader_flash_verify();" "$RUNNER_TEMP/esp-flasher-upstream/esp_flasher_worker.c"
          test ! -e "$RUNNER_TEMP/momentum-fw/applications_user/esp_flasher"
          cp -a "$RUNNER_TEMP/esp-flasher-upstream" "$RUNNER_TEMP/momentum-fw/applications_user/esp_flasher"
          cd "$RUNNER_TEMP/momentum-fw"
          ./fbt TARGET_HW=7 COMPACT=1 fap_esp_flasher -j2
          FAP_PATH="$(find "$RUNNER_TEMP/momentum-fw" -name esp_flasher.fap -type f -print -quit)"
          test -n "$FAP_PATH"
          test -s "$FAP_PATH"
          cp "$FAP_PATH" "$RUNNER_TEMP/esp_flasher.fap"
          test -s "$RUNNER_TEMP/esp_flasher.fap"
          echo "Patched GPL ESP Flasher built against the pinned custom Momentum SDK."
          echo "FAP will be bundled separately WITH GPL/source provenance, encrypted and UNTESTED."
      - name: Verify native Momentum .tgz and encrypt phone-ready package
        env:
          DELIVERY_PASSPHRASE: ${{ secrets.FLIPPER_ARTIFACT_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/prepare_momentum_flash_package.py pack \
            --dist "$RUNNER_TEMP/momentum-fw/dist/f7-C" \
            --out "$RUNNER_TEMP/firmware-delivery" \
            --source-revision "$(git -C "$RUNNER_TEMP/private-ai" rev-parse HEAD)" \
            --momentum-revision "$(git -C "$RUNNER_TEMP/momentum-fw" rev-parse HEAD)"
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/firmware-delivery/flipper-ai-native-tgz-delivery.tar.gz" \
            -out "$RUNNER_TEMP/flipper-ai-native-tgz-delivery.tar.gz.enc" \
            -pass env:DELIVERY_PASSPHRASE
          test -s "$RUNNER_TEMP/flipper-ai-native-tgz-delivery.tar.gz.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/flipper-ai-native-tgz-delivery.tar.gz.enc" \
            -out "$RUNNER_TEMP/firmware-delivery/roundtrip.tar.gz" \
            -pass env:DELIVERY_PASSPHRASE
          cmp "$RUNNER_TEMP/firmware-delivery/flipper-ai-native-tgz-delivery.tar.gz" \
              "$RUNNER_TEMP/firmware-delivery/roundtrip.tar.gz"
          python3 scripts/prepare_momentum_flash_package.py verify \
            --archive "$RUNNER_TEMP/firmware-delivery/roundtrip.tar.gz"
          rm -rf "$RUNNER_TEMP/firmware-delivery"
          echo "Native Momentum F7 .tgz validated, encrypted, and plaintext removed."
      - name: Create and roundtrip-verify separate encrypted GPL ESP programmer package
        env:
          DELIVERY_PASSPHRASE: ${{ secrets.FLIPPER_ARTIFACT_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/prepare_esp_flasher_delivery.py pack \
            --fap "$RUNNER_TEMP/esp_flasher.fap" \
            --license "$RUNNER_TEMP/esp-flasher-upstream/LICENSE" \
            --out "$RUNNER_TEMP/esp32-programmer-UNTESTED.tar.gz" \
            --patch-revision b23336cd70984daac99d05568504ebccef8c1698 \
            --momentum-revision "$(git -C "$RUNNER_TEMP/momentum-fw" rev-parse HEAD)" \
            --firmware-source-revision "$(git -C "$RUNNER_TEMP/private-ai" rev-parse HEAD)"
          python3 scripts/prepare_esp_flasher_delivery.py verify \
            --archive "$RUNNER_TEMP/esp32-programmer-UNTESTED.tar.gz"
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/esp32-programmer-UNTESTED.tar.gz" \
            -out "$RUNNER_TEMP/esp32-programmer-UNTESTED.tar.gz.enc" \
            -pass env:DELIVERY_PASSPHRASE
          test -s "$RUNNER_TEMP/esp32-programmer-UNTESTED.tar.gz.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/esp32-programmer-UNTESTED.tar.gz.enc" \
            -out "$RUNNER_TEMP/programmer-roundtrip.tar.gz" \
            -pass env:DELIVERY_PASSPHRASE
          cmp "$RUNNER_TEMP/esp32-programmer-UNTESTED.tar.gz" \
              "$RUNNER_TEMP/programmer-roundtrip.tar.gz"
          python3 scripts/prepare_esp_flasher_delivery.py verify \
            --archive "$RUNNER_TEMP/programmer-roundtrip.tar.gz"
          rm -f "$RUNNER_TEMP/esp32-programmer-UNTESTED.tar.gz" \
                "$RUNNER_TEMP/programmer-roundtrip.tar.gz" \
                "$RUNNER_TEMP/esp_flasher.fap"
          echo "Only encrypted GPL programmer artifact retained; no installed Flipper app."
      - name: Upload encrypted GPL ESP Flasher FAP + license/source provenance
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-esp32-programmer-momentum-sdk-GPL-UNTESTED
          path: ${{ runner.temp }}/esp32-programmer-UNTESTED.tar.gz.enc
          if-no-files-found: error
          retention-days: 7
      - name: Upload encrypted firmware package only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-flipper-ai-esp32-integration-preview-tgz-UNTESTED
          path: ${{ runner.temp }}/flipper-ai-native-tgz-delivery.tar.gz.enc
          if-no-files-found: error
          retention-days: 7
      - name: Compose one encrypted ESP32 + Momentum next-flash release candidate
        shell: bash
        env:
          DELIVERY_PASSPHRASE: ${{ secrets.FLIPPER_ARTIFACT_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/esp32-unified-private"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/flipper-ai-native-tgz-delivery.tar.gz.enc" \
            -out "$RUNNER_TEMP/esp32-unified-private/flipper.tar.gz" \
            -pass env:DELIVERY_PASSPHRASE
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/esp32-programmer-UNTESTED.tar.gz.enc" \
            -out "$RUNNER_TEMP/esp32-unified-private/programmer.tar.gz" \
            -pass env:DELIVERY_PASSPHRASE
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/esp32-components-UNTESTED.tar.gz.enc" \
            -out "$RUNNER_TEMP/esp32-unified-private/components.tar.gz" \
            -pass env:DELIVERY_PASSPHRASE
          python3 scripts/prepare_unified_esp32_release.py pack \
            --firmware "$RUNNER_TEMP/esp32-unified-private/flipper.tar.gz" \
            --flasher "$RUNNER_TEMP/esp32-unified-private/programmer.tar.gz" \
            --esp32 "$RUNNER_TEMP/esp32-unified-private/components.tar.gz" \
            --out "$RUNNER_TEMP/esp32-unified-private/FlipperAI_ESP32_Complete_Flash_Candidate_UNTESTED.zip"
          python3 scripts/prepare_unified_esp32_release.py verify \
            --archive "$RUNNER_TEMP/esp32-unified-private/FlipperAI_ESP32_Complete_Flash_Candidate_UNTESTED.zip"
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/esp32-unified-private/FlipperAI_ESP32_Complete_Flash_Candidate_UNTESTED.zip" \
            -out "$RUNNER_TEMP/FlipperAI_ESP32_Complete_Flash_Candidate_UNTESTED.zip.enc" \
            -pass env:DELIVERY_PASSPHRASE
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/FlipperAI_ESP32_Complete_Flash_Candidate_UNTESTED.zip.enc" \
            -out "$RUNNER_TEMP/esp32-unified-private/unified-verify.zip" \
            -pass env:DELIVERY_PASSPHRASE
          cmp "$RUNNER_TEMP/esp32-unified-private/unified-verify.zip" \
            "$RUNNER_TEMP/esp32-unified-private/FlipperAI_ESP32_Complete_Flash_Candidate_UNTESTED.zip"
          python3 scripts/prepare_unified_esp32_release.py verify \
            --archive "$RUNNER_TEMP/esp32-unified-private/unified-verify.zip"
          rm -rf "$RUNNER_TEMP/esp32-unified-private"
          test -s "$RUNNER_TEMP/FlipperAI_ESP32_Complete_Flash_Candidate_UNTESTED.zip.enc"
          echo 'Three version-matched release components packaged and encrypted; NO device writes.'
      - name: Upload encrypted all-in-one ESP32 + Momentum flash candidate only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-FlipperAI-ESP32-GATT-AUDITED-NEXT-FLASH-CANDIDATE-UNTESTED
          path: ${{ runner.temp }}/FlipperAI_ESP32_Complete_Flash_Candidate_UNTESTED.zip.enc
          if-no-files-found: error
          retention-days: 7
      - name: Report verified scope without publishing private binaries
        run: |
          echo "Custom AI Momentum firmware compiled; native mobile F7 .tgz checked."
          echo "Only two ENCRYPTED development artifacts uploaded: native updater and separately licensed GPL Flasher FAP. Neither installed on hardware."
