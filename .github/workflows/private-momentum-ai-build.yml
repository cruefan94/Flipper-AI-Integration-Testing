name: Private Momentum AI compile on public runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custom-firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check private source credential
        env:
          PRIVATE_TOKEN: ${{ secrets.FLIPPER_PRIVATE_SOURCE_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::Configure repository secret FLIPPER_PRIVATE_SOURCE_TOKEN with read-only Contents access to the private firmware repository."
            exit 1
          fi
      - name: Require encrypted delivery secret before building
        env:
          DELIVERY_PASSPHRASE: ${{ secrets.FLIPPER_ARTIFACT_PASSPHRASE }}
        run: |
          if [ "${#DELIVERY_PASSPHRASE}" -lt 20 ]; then
            echo "::error::Set FLIPPER_ARTIFACT_PASSPHRASE to a unique random passphrase of at least 20 characters; no plaintext firmware will be uploaded."
            exit 1
          fi
      - name: Checkout public test harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch private AI source without persisting credentials
        env:
          PRIVATE_TOKEN: ${{ secrets.FLIPPER_PRIVATE_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'machine github.com login x-access-token password %s\n' "$PRIVATE_TOKEN" > "$RUNNER_TEMP/private.netrc"
          chmod 600 "$RUNNER_TEMP/private.netrc"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0=
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/bin/false
          export HOME="$RUNNER_TEMP"
          mv "$RUNNER_TEMP/private.netrc" "$HOME/.netrc"
          trap 'rm -f "$HOME/.netrc"' EXIT
          git -c http.extraheader= clone --quiet --depth 1 --branch fix/momentum-installer-preflight-v56 \
            https://github.com/cruefan94/Flipper-AI-Momentum-.git "$RUNNER_TEMP/private-ai"
          test -f "$RUNNER_TEMP/private-ai/momentum_overlay/install_source_overlay.py"
      - name: Clone pinned upstream Momentum
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/Next-Flip/Momentum-Firmware.git "$RUNNER_TEMP/momentum-fw"
          git -C "$RUNNER_TEMP/momentum-fw" checkout --quiet --detach d3f89dfe2ef6b01839201598e9be1590cba80322
      - name: Private overlay source and Python unit tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-ai"
          python3 -m py_compile momentum_overlay/install_source_overlay.py momentum_overlay/install_trusted_gap_hook.py momentum_overlay/install_bt_ai_api.py momentum_overlay/mark_internal_api.py scripts/patch_app.py
          python3 -m unittest discover -s momentum_overlay/tests -p 'test_*.py' -v
      - name: Apply AI source overlays
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-ai"
          python3 momentum_overlay/install_source_overlay.py "$RUNNER_TEMP/momentum-fw"
          python3 momentum_overlay/install_trusted_gap_hook.py "$RUNNER_TEMP/momentum-fw"
          python3 momentum_overlay/install_bt_ai_api.py "$RUNNER_TEMP/momentum-fw"
          python3 momentum_overlay/mark_internal_api.py "$RUNNER_TEMP/momentum-fw/targets/f7/api_symbols.csv"
          python3 scripts/patch_app.py "$RUNNER_TEMP/momentum-fw" --mode internal --autostart yes --ble-experimental
      - name: Normalize upstream Git version metadata parser for CI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path(__import__('os').environ['RUNNER_TEMP']) / 'momentum-fw/scripts/version.py'
          src = p.read_text()
          old = 'url, _ = destination.split(" ")'
          new = 'url, _ = destination.rsplit(" ", 1)'
          if src.count(old) != 1:
              raise SystemExit('Upstream Git metadata parser changed; refusing blind patch')
          p.write_text(src.replace(old, new, 1))
          print('Applied CI-only remote URL parser compatibility fix')
          PY
      - name: Compile custom Momentum AI firmware
        working-directory: ${{ runner.temp }}/momentum-fw
        run: |
          set -euo pipefail
          ./fbt TARGET_HW=7 COMPACT=1 copro_dist updater_package fap_dist -j2
      - name: Verify updater package and encrypt for private delivery
        env:
          DELIVERY_PASSPHRASE: ${{ secrets.FLIPPER_ARTIFACT_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "momentum-fw/dist/f7-C"
          dirs = sorted(p for p in root.glob("f7-update-*") if p.is_dir())
          if len(dirs) != 1:
              raise SystemExit(f"Expected one firmware updater directory, got {len(dirs)}")
          directory = dirs[0]
          files = sorted(p for p in directory.rglob("*") if p.is_file())
          if not files or not any(p.suffix == ".dfu" for p in files):
              raise SystemExit("Updater missing expected .dfu firmware image")
          if not any(p.suffix == ".tgz" for p in files) and not any(p.suffix == ".bin" for p in files):
              print("No additional .bin/.tgz component; checking updater contents only")
          manifest = {"updater": directory.name, "files": {
              str(p.relative_to(directory)): {"size": p.stat().st_size, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in files}}
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "firmware-delivery"
          output.mkdir(mode=0o700, exist_ok=True)
          (output / "SHA256-manifest.json").write_text(json.dumps(manifest, indent=2))
          archive = output / "flipper-ai-updater.tar.gz"
          with tarfile.open(archive, "w:gz") as tar:
              tar.add(directory, arcname=directory.name)
              tar.add(output / "SHA256-manifest.json", arcname="SHA256-manifest.json")
          print(f"Verified {len(files)} updater files; package prepared for encryption")
          PY
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/firmware-delivery/flipper-ai-updater.tar.gz" \
            -out "$RUNNER_TEMP/flipper-ai-updater.tar.gz.enc" \
            -pass env:DELIVERY_PASSPHRASE
          test -s "$RUNNER_TEMP/flipper-ai-updater.tar.gz.enc"
          # Prove the encrypted artifact can be decrypted and every packaged file matches its manifest.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/flipper-ai-updater.tar.gz.enc" \
            -out "$RUNNER_TEMP/firmware-delivery/roundtrip.tar.gz" \
            -pass env:DELIVERY_PASSPHRASE
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, tarfile
          folder = pathlib.Path(os.environ["RUNNER_TEMP"]) / "firmware-delivery"
          expected = folder / "flipper-ai-updater.tar.gz"
          recovered = folder / "roundtrip.tar.gz"
          if hashlib.sha256(expected.read_bytes()).digest() != hashlib.sha256(recovered.read_bytes()).digest():
              raise SystemExit("Encrypted archive roundtrip mismatch")
          with tarfile.open(recovered, "r:gz") as archive:
              members = archive.getmembers()
              if any(not m.isfile() and not m.isdir() for m in members):
                  raise SystemExit("Archive contains unsupported entries")
              names = [m.name for m in members if m.isfile()]
              if len(names) != len(set(names)):
                  raise SystemExit("Archive contains duplicate paths")
              manifest = json.load(archive.extractfile("SHA256-manifest.json"))
              updater = manifest["updater"]
              records = manifest["files"]
              if not records or len(names) != len(records) + 1:
                  raise SystemExit("Archive file inventory differs from manifest")
              for relative, record in records.items():
                  path = pathlib.PurePosixPath(relative)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Unsafe updater path in manifest")
                  member = archive.getmember(f"{updater}/{relative}")
                  data = archive.extractfile(member).read()
                  if len(data) != record["size"] or hashlib.sha256(data).hexdigest() != record["sha256"]:
                      raise SystemExit(f"Manifest verification failed: {relative}")
          print(f"Encrypted archive decrypts correctly; verified {len(records)} file hashes")
          PY
          rm -rf "$RUNNER_TEMP/firmware-delivery"
          echo "Encrypted firmware package prepared; plaintext removed before upload."
      - name: Upload encrypted firmware package only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-flipper-ai-updater
          path: ${{ runner.temp }}/flipper-ai-updater.tar.gz.enc
          if-no-files-found: error
          retention-days: 7
      - name: Report verified scope without publishing private binaries
        run: |
          echo "Custom AI firmware compile succeeded on the public runner."
          echo "Only a passphrase-encrypted firmware archive was uploaded; no plaintext firmware or private source was published."
