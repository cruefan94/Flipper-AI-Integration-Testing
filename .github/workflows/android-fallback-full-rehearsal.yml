name: Public-safe Android fallback full build rehearsal (no install)

on:
  # Owner-reviewed manual initiation only; no unattended push/PR/schedule builds.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-fallback-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout public-only fallback tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard fallback SDK contract
        run: python3 -m unittest discover -s tests -p 'test_android_fallback_sdk_setup.py' -v
      - name: Checkout pinned public Android Satellite source
        uses: actions/checkout@v4
        with:
          repository: cruefan94/Flipper-AI-Android-Satellite
          ref: 958008c1ae1ee489c6c27ab256c925888941986d
          path: android-source
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate installed Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Missing preinstalled Android SDK on hosted runner}"
          SDKMANAGER_BIN="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER_BIN"
          echo "$(dirname "$SDKMANAGER_BIN")" >> "$GITHUB_PATH"
          "$SDKMANAGER_BIN" --version
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run actual public Android source preflight and host tests
        shell: bash
        run: |
          set -euo pipefail
          python3 android-source/android_satellite/tools/preflight.py
          bash android-source/android_satellite/tests/run_core_tests.sh
      - name: Rehearse actual fallback Android APK compilation
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          gradle -p android-source/android_satellite :app:assembleDebug --no-daemon --stacktrace
          apk="android-source/android_satellite/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk"
          echo "Public Android source compiled; APK NOT uploaded or installed. Not a stable-signing or device test."
