name: Pi backup verifier descriptor regressions
on:
  pull_request:
    paths:
      - 'raspberry_pi/pi_backup_manifest_verify.py'
      - 'tests/test_pi_backup*.py'
      - '.github/workflows/pi-backup-verifier-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile verifier and synthetic tests
        run: python -m py_compile raspberry_pi/pi_backup_manifest_verify.py tests/test_pi_backup_manifest_verify.py tests/test_pi_backup_filesystem_safety.py tests/test_pi_backup_descriptor_safety.py
      - name: Run backup verifier synthetic regressions
        run: python -m unittest discover -s tests -p 'test_pi_backup*.py' -v
