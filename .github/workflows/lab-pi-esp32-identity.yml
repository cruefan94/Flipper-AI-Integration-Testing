name: Lab Pi ESP32 serial identity (offline)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lab/pi_esp32_serial_identity_offline.py'
      - '.github/workflows/lab-pi-esp32-identity.yml'
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile exact checked-out source
        run: python3 -m py_compile lab/pi_esp32_serial_identity_offline.py
      - name: Run embedded synthetic tests only
        run: python3 -m unittest -v lab/pi_esp32_serial_identity_offline.py
