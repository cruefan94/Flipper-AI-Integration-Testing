name: ESP32 ROM family offline evidence regression
on:
  push:
    branches:
      - 'lab/esp32-rom-family-offline-ci-20261119-0521'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-rom-family:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile offline classifier
        run: python3 -m py_compile lab/esp32/test_rom_chip_family_evidence.py
      - name: Run synthetic ROM banner tests
        run: python3 -m unittest -v lab/esp32/test_rom_chip_family_evidence.py
