name: Pi health parser exact synthetic tests
on:
  push:
    branches:
      - test/pi-health-exact-20261120
  pull_request:
    paths:
      - 'raspberry_pi/pi_health_snapshot.py'
      - 'tests/test_pi_health_snapshot.py'
      - '.github/workflows/pi-health-exact.yml'
permissions:
  contents: read
jobs:
  offline-health-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact five synthetic tests; zero skips
        run: |
          python - <<'PY'
          import importlib.util
          import pathlib
          import sys
          import unittest
          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root))
          path = root / 'tests' / 'test_pi_health_snapshot.py'
          spec = importlib.util.spec_from_file_location('pi_health_tests', path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          assert suite.countTestCases() == 5, f'Expected exactly five tests, got {suite.countTestCases()}'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 5 and not result.skipped and result.wasSuccessful(), 'Pi health regression gate failed'
          PY
