name: Offline artifact hash gate synthetic tests
on:
  pull_request:
    paths:
      - 'tools/check_local_artifact_sha256.py'
      - 'tools/test_local_artifact_sha256.py'
      - '.github/workflows/offline-artifact-hash-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-hash-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run offline synthetic SHA-256 tests
        run: python3 -m unittest discover -s tools -p 'test_local_artifact_sha256.py' -v
