name: Pi qFlipper USB evidence (offline)
on:
  pull_request:
    paths:
      - 'pi_lab/qflipper_usb_evidence.py'
      - 'pi_lab/test_qflipper_usb_evidence.py'
      - '.github/workflows/pi-qflipper-usb-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-parser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax without importing hardware libraries
        run: python -m py_compile pi_lab/qflipper_usb_evidence.py pi_lab/test_qflipper_usb_evidence.py
      - name: Run offline regression suite
        run: python -m unittest -v pi_lab.test_qflipper_usb_evidence
