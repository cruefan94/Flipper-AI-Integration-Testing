name: Pi desktop launcher audit regression
on:
  push:
    branches:
      - test/pi-desktop-launcher-report-ci-20261119
  pull_request:
    paths:
      - 'raspberry_pi/desktop_launcher_*.py'
      - 'tests/test_pi_desktop_launcher*.py'
      - '.github/workflows/pi-desktop-launcher-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-launcher-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile launcher audit and report
        run: python -m py_compile raspberry_pi/desktop_launcher_audit.py raspberry_pi/desktop_launcher_report.py
      - name: Run synthetic desktop launcher regressions
        run: python -m unittest discover -s tests -p 'test_pi_desktop_launcher*.py' -v
      - name: Safety boundary
        run: echo "Synthetic tests only; no Raspberry Pi, fan, OLED, GPIO, firmware, or package changes."
