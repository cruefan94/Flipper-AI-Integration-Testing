name: Public runner smoke test (no private source)
on:
  push:
    branches:
      - ci/public-runner-recovery-20261112
    paths:
      - .github/workflows/public-runner-smoke-20261112.yml
      - tests/test_public_ai1_smoke.py
      - tests/PublicAi1Fixture.java
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner and Python without private firmware
        run: |
          python3 --version
          python3 -c 'import ast; ast.parse("value = 42"); print("python smoke OK")'
      - name: Run public-safe protocol smoke tests
        run: python3 -m unittest discover -s tests -p 'test_public_ai1_smoke.py' -v
      - name: Run independent Java framing fixture
        run: |
          mkdir -p /tmp/flipper-ai-java-fixture
          javac -d /tmp/flipper-ai-java-fixture tests/PublicAi1Fixture.java
          java -cp /tmp/flipper-ai-java-fixture PublicAi1Fixture
      - name: Verify Node runtime
        run: |
          node --version
          node -e 'if (1 + 1 !== 2) process.exit(1); console.log("node smoke OK")'
      - name: Report public-only test boundary
        run: |
          echo "This workflow does not fetch private Momentum firmware or credentials."
