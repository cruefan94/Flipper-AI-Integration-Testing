name: Android fallback SDK preflight (public-safe, no app build)
on:
  pull_request:
    paths:
      - ".github/workflows/ci-fallback-verify.yml"
      - ".github/workflows/android-fallback-sdk-preflight.yml"
      - "tests/test_android_fallback_sdk_setup.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify static fallback SDK contract (no private source)
        run: python3 -m unittest discover -s tests -p 'test_android_fallback_sdk_setup.py' -v
      - name: Verify hosted SDK and required packages without legacy tools
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Missing preinstalled Android SDK on GitHub-hosted runner}"
          SDKMANAGER_BIN="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER_BIN"
          echo "$(dirname "$SDKMANAGER_BIN")" >> "$GITHUB_PATH"
          "$SDKMANAGER_BIN" --version
          "$SDKMANAGER_BIN" --install "platforms;android-35" "build-tools;35.0.0"
          test -f "${ANDROID_HOME}/platforms/android-35/android.jar"
          test -x "${ANDROID_HOME}/build-tools/35.0.0/aapt"
          echo "SDK provisioning passed; no APK, private source, device or cloud deployment used."
