name: Android upgrade metadata gate (offline regression)
on:
  pull_request:
    paths:
      - 'scripts/android_upgrade_admission.py'
      - '.github/workflows/android-upgrade-metadata-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-gate-self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run all eight Android upgrade admission regressions
        run: python3 scripts/android_upgrade_admission.py --self-test
      - name: Confirm metadata-only scope
        run: |
          echo "Offline synthetic metadata tests only."
          echo "No APK, signing key, installed phone, BLE device or firmware accessed."
