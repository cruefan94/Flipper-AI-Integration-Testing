name: Public-safe two-failure fallback classifier regression
on:
  pull_request:
    paths:
      - 'tests/test_failure_pair_classifier.py'
      - '.github/workflows/failure-pair-classifier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-failure-pair-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public-safe metadata-only fallback classification
        run: python3 -m unittest discover -s tests -p 'test_failure_pair_classifier.py' -v
