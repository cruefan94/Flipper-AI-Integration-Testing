name: Pi offline USB diff isolated regression
on:
  push:
    branches:
      - feature/pi-usb-diff-clean-20261121
  pull_request:
    paths:
      - 'raspberry_pi/usb_inventory_diff.py'
      - 'tests/test_pi_usb_inventory_diff.py'
      - '.github/workflows/pi-usb-diff-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and eight synthetic tests (no USB access)
        run: |
          python -m py_compile raspberry_pi/usb_inventory_diff.py tests/test_pi_usb_inventory_diff.py
          python -m unittest discover -s tests -p 'test_pi_usb_inventory_diff.py' -v
