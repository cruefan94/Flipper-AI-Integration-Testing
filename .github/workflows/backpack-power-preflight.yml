name: Backpack power preflight (offline)
on:
  push:
    branches:
      - 'lab/backpack-power-ci-*'
    paths:
      - 'lab/backpack_power_preflight.py'
      - '.github/workflows/backpack-power-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile synthetic preflight
        run: python -m py_compile lab/backpack_power_preflight.py
      - name: Run nine offline tests
        run: python -m unittest -v lab/backpack_power_preflight.py
