name: Public AI1 BLE contract smoke tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/test_ai1_contract.py'
      - 'tests/test_virtual_ai1_session.py'
      - 'tests/virtual_ai1_session.py'
      - '.github/workflows/ai1-contract.yml'
permissions:
  contents: read
jobs:
  ai1-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout public Android Satellite source
        uses: actions/checkout@v4
        with:
          repository: cruefan94/Flipper-AI-Android-Satellite
          ref: fix/android-chat-continuity-secure-cloud-settings-v241
          path: android-source
          persist-credentials: false
      - name: Verify Android AI GATT UUID parity with public contract
        run: python3 tests/check_android_ai1_parity.py android-source/android_satellite/app/src/main/java/com/flipperai/satellite/BleSatellite.java
      - name: Verify public AI1 protocol fixtures and virtual sessions
        run: python3 -m unittest discover -s tests -p 'test_*ai1*.py' -v
      - name: Verify virtual session adversarial cases
        run: python3 -m unittest discover -s tests -p 'test_virtual_ai1_session.py' -v
