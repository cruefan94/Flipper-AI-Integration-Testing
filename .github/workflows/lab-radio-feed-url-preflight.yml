name: Lab receive-only radio URL preflight
on:
  push:
    branches:
      - lab/radio-feed-url-safety-20261119-1823
  workflow_dispatch:
jobs:
  offline-radio-url-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and execute exact synthetic suite
        run: |
          python -m py_compile lab/radio_feed_url_preflight.py lab/test_radio_feed_url_preflight.py
          python -m unittest discover -s lab -p test_radio_feed_url_preflight.py -v
