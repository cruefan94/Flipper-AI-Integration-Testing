name: Side project - battery optimizer host checks
on:
  workflow_dispatch:
  push:
    branches:
      - 'sideproject/flipper-ai-battery-optimizer-*'
    paths:
      - 'side_projects/flipper_ai_battery_optimizer/**'
      - '.github/workflows/sideproject-battery-optimizer.yml'
permissions:
  contents: read
jobs:
  java-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test portable Java core
        run: |
          ROOT=side_projects/flipper_ai_battery_optimizer
          mkdir -p /tmp/flipper-ai-battery-classes
          javac -Xlint:all -Werror -d /tmp/flipper-ai-battery-classes "$ROOT"/src/flipperai/battery/*.java "$ROOT"/tests/flipperai/battery/*.java
          for suite in BatteryOptimizerTest BatteryTelemetryCodecTest BatteryMonitorSessionTest BatteryDischargeStudyTest BatteryRequestCodecTest BatteryReadTransportTest; do
            java -cp /tmp/flipper-ai-battery-classes flipperai.battery.$suite
          done
      - name: Compile and test standalone C power provider
        run: |
          ROOT=side_projects/flipper_ai_battery_optimizer
          cc -std=c11 -Wall -Wextra -Werror -pedantic "$ROOT"/firmware_adapter/battery_telemetry.c "$ROOT"/tests/c/test_battery_telemetry.c -o /tmp/battery_telemetry_test
          /tmp/battery_telemetry_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic "$ROOT"/firmware_adapter/battery_request.c "$ROOT"/tests/c/test_battery_request.c -o /tmp/battery_request_test
          /tmp/battery_request_test
          cc -std=c11 -Wall -Wextra -Werror -pedantic "$ROOT"/firmware_adapter/battery_service.c "$ROOT"/firmware_adapter/battery_request.c "$ROOT"/firmware_adapter/battery_telemetry.c "$ROOT"/tests/c/test_battery_service.c -o /tmp/battery_service_test
          /tmp/battery_service_test
      - name: Run Java-C-Java wire round-trip
        run: |
          ROOT=side_projects/flipper_ai_battery_optimizer
          cc -std=c11 -Wall -Wextra -Werror -pedantic "$ROOT"/firmware_adapter/battery_service.c "$ROOT"/firmware_adapter/battery_request.c "$ROOT"/firmware_adapter/battery_telemetry.c "$ROOT"/tests/c/battery_roundtrip_cli.c -o /tmp/battery_roundtrip
          set -o pipefail
          java -cp /tmp/flipper-ai-battery-classes flipperai.battery.BatteryWireRoundTripTest request | /tmp/battery_roundtrip | java -cp /tmp/flipper-ai-battery-classes flipperai.battery.BatteryWireRoundTripTest response
      - name: Run existing public AI1 contract regression checks
        run: python3 -m unittest discover -s tests -p 'test_ai1_contract.py' -v
