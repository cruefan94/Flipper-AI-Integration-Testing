name: Side project - battery optimizer host checks
on:
  workflow_dispatch:
  push:
    branches:
      - 'sideproject/flipper-ai-battery-optimizer-*'
    paths:
      - 'side_projects/flipper_ai_battery_optimizer/**'
      - '.github/workflows/sideproject-battery-optimizer.yml'
permissions:
  contents: read
jobs:
  java-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile independent Java core and host tests
        run: |
          mkdir -p /tmp/flipper-ai-battery-classes
          javac -Xlint:all -Werror -d /tmp/flipper-ai-battery-classes \
            side_projects/flipper_ai_battery_optimizer/src/flipperai/battery/BatteryOptimizer.java \
            side_projects/flipper_ai_battery_optimizer/src/flipperai/battery/BatteryTelemetryCodec.java \
            side_projects/flipper_ai_battery_optimizer/src/flipperai/battery/BatteryMonitorSession.java \
            side_projects/flipper_ai_battery_optimizer/src/flipperai/battery/BatteryDischargeStudy.java \
            side_projects/flipper_ai_battery_optimizer/tests/flipperai/battery/BatteryOptimizerTest.java \
            side_projects/flipper_ai_battery_optimizer/tests/flipperai/battery/BatteryTelemetryCodecTest.java \
            side_projects/flipper_ai_battery_optimizer/tests/flipperai/battery/BatteryMonitorSessionTest.java \
            side_projects/flipper_ai_battery_optimizer/tests/flipperai/battery/BatteryDischargeStudyTest.java
          java -cp /tmp/flipper-ai-battery-classes flipperai.battery.BatteryOptimizerTest
          java -cp /tmp/flipper-ai-battery-classes flipperai.battery.BatteryTelemetryCodecTest
          java -cp /tmp/flipper-ai-battery-classes flipperai.battery.BatteryMonitorSessionTest
          java -cp /tmp/flipper-ai-battery-classes flipperai.battery.BatteryDischargeStudyTest
      - name: Build and test standalone power telemetry C formatter
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            side_projects/flipper_ai_battery_optimizer/firmware_adapter/battery_telemetry.c \
            side_projects/flipper_ai_battery_optimizer/tests/c/test_battery_telemetry.c \
            -o /tmp/flipper-battery-c-tests
          /tmp/flipper-battery-c-tests
      - name: Run existing public AI1 wire contract tests (regression)
        run: python3 -m unittest discover -s tests -p 'test_ai1_contract.py' -v
