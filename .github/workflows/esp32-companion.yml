name: ESP32 Expansion isolated source checks
on:
  push:
    paths:
      - 'esp32-expansion/**'
      - 'hardware-installer/**'
      - '.github/workflows/esp32-companion.yml'
  pull_request:
    paths:
      - 'esp32-expansion/**'
      - 'hardware-installer/**'
      - '.github/workflows/esp32-companion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute bounded protocol parser tests
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -Iesp32-expansion/firmware/src \
            esp32-expansion/firmware/src/protocol.cpp \
            esp32-expansion/tests/test_protocol.cpp -o /tmp/fz1-protocol-test
          /tmp/fz1-protocol-test
  esp32-reference:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PlatformIO
        run: python3 -m pip install --user platformio
      - name: Build classic ESP32 DevKit example (NOT board validated)
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          pio run -d esp32-expansion/firmware -e esp32dev
      - name: Generate hash-checked board-specific reference bundle (not hardware verified)
        shell: bash
        run: |
          set -euo pipefail
          python3 hardware-installer/build_esp32_reference_bundle.py \
            --build esp32-expansion/firmware/.pio/build/esp32dev \
            --out esp32-reference-bundle \
            --version 0.1.0-dev \
            --source-revision "$GITHUB_SHA"
          python3 hardware-installer/verify_bundle.py esp32-reference-bundle/manifest.json \
            --board esp32_wroom32_devkit
          test -s esp32-reference-bundle/READ_ME_BEFORE_FLASHING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-wroom32-reference-manifest-bin-BUNDLE-UNTESTED
          path: esp32-reference-bundle/
          if-no-files-found: error
          retention-days: 7
  flipper-app:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install upstream Flipper build tool
        run: python3 -m pip install --user ufbt
      - name: Build ESP32 Manager FAP against official SDK (NOT Momentum validated)
        working-directory: esp32-expansion/flipper
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          ufbt
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-manager-upstream-FAP-NOT-MOMENTUM-VERIFIED
          path: esp32-expansion/flipper/dist/**/*.fap
          if-no-files-found: error
          retention-days: 7
