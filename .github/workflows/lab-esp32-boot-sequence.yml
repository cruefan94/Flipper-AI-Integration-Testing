name: Lab ESP32 BOOT sequence offline
on:
  push:
    branches:
      - lab/esp32-boot-sequence-offline-20261120-2025
  pull_request:
    paths:
      - 'lab/esp32_boot_sequence/**'
      - '.github/workflows/lab-esp32-boot-sequence.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic offline tests
        run: cd lab/esp32_boot_sequence && python3 -m unittest -v test_sequence_gate.py
