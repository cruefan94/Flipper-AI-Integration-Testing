name: Public-safe fallback attribution gate
on:
  push:
    branches:
      - audit/fallback-attribution-validator-20261118-0801
    paths:
      - tests/test_fallback_attribution_gate.py
      - .github/workflows/fallback-attribution-gate.yml
  pull_request:
    paths:
      - tests/test_fallback_attribution_gate.py
      - .github/workflows/fallback-attribution-gate.yml
permissions:
  contents: read
jobs:
  attribution-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_fallback_attribution_gate.py -v
