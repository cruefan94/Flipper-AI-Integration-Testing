name: Offline release evidence gate
on:
  push:
    branches:
      - audit/candidate-evidence-failclosed-20261120-2059
  pull_request:
    paths:
      - 'tools/release_evidence_gate.py'
      - 'tests/test_release_evidence_gate.py'
      - '.github/workflows/offline-release-evidence-gate.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline synthetic tests only
        run: python -m unittest discover -s tests -p 'test_release_evidence_gate.py' -v
