name: ESP32 power-domain offline preflight
on:
  push:
    branches:
      - lab/esp32-power-domain-preflight-20261121-1420
  pull_request:
    paths:
      - 'lab/esp32_power_domain_preflight.py'
      - 'tests/test_esp32_power_domain_preflight.py'
      - '.github/workflows/esp32-power-domain-preflight.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run isolated tests
        run: |
          python -m py_compile lab/esp32_power_domain_preflight.py tests/test_esp32_power_domain_preflight.py
          python -m unittest discover -s tests -p 'test_esp32_power_domain_preflight.py' -v
