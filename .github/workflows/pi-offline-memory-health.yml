name: Pi offline memory health tests
on:
  pull_request:
    paths:
      - 'pi_lab/offline_memory_health.py'
      - 'pi_lab/test_offline_memory_health.py'
      - '.github/workflows/pi-offline-memory-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-memory-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline syntax and regression
        run: |
          python -m py_compile pi_lab/offline_memory_health.py pi_lab/test_offline_memory_health.py
          python -m unittest pi_lab.test_offline_memory_health -v
