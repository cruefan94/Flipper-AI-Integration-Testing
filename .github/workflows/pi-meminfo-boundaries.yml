name: Pi meminfo boundary offline tests
on:
  push:
    branches:
      - pi/meminfo-boundary-tests-20261121-2016
    paths:
      - 'pi_lab/test_meminfo_boundaries.py'
      - 'pi_lab/meminfo_snapshot_parser.py'
      - 'pi_lab/browser_memory_advisor.py'
      - '.github/workflows/pi-meminfo-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-meminfo-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run offline parser regression tests
        run: |
          python3 -m py_compile pi_lab/browser_memory_advisor.py pi_lab/meminfo_snapshot_parser.py pi_lab/test_meminfo_boundaries.py
          python3 -m unittest discover -s pi_lab -p 'test_meminfo_boundaries.py' -v
