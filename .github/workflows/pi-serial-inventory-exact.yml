name: Pi serial inventory exact offline tests
on:
  push:
    branches:
      - lab/pi-serial-inventory-edgecases-20261119-2227
  pull_request:
    paths:
      - 'lab/pi_serial_inventory.py'
      - 'lab/test_pi_serial_inventory*.py'
      - '.github/workflows/pi-serial-inventory-exact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile offline modules
        run: python -m py_compile lab/pi_serial_inventory.py lab/test_pi_serial_inventory.py lab/test_pi_serial_inventory_boundaries.py
      - name: Run all 17 exact offline regression cases
        run: |
          python -m unittest discover -s lab -p 'test_pi_serial_inventory*.py' -v
