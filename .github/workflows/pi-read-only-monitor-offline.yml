name: Pi read-only monitor offline tests
on:
  pull_request:
    paths:
      - 'pi_lab/read_only_monitor.py'
      - 'pi_lab/test_read_only_monitor.py'
      - '.github/workflows/pi-read-only-monitor-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax and offline regression tests
        run: |
          python -m py_compile pi_lab/read_only_monitor.py pi_lab/test_read_only_monitor.py
          python -m unittest pi_lab.test_read_only_monitor -v
