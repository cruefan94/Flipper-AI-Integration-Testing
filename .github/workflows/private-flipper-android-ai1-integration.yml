name: Flipper C ↔ Android Java AI1 integration (public runner)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-flipper-android-ai1-integration.yml'
permissions:
  contents: read
jobs:
  protocol-integration:
    strategy:
      fail-fast: false
      matrix:
        private_ref:
          - fix/momentum-installer-preflight-v56
          - fix/android-ci-successor-branches-v58
          - feature/momentum-ble-first-consent-v61
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify private read-only credential is configured
        env:
          PRIVATE_TOKEN: ${{ secrets.FLIPPER_PRIVATE_SOURCE_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::Read-only FLIPPER_PRIVATE_SOURCE_TOKEN is required for private source access."
            exit 1
          fi
      - name: Checkout public contract test harness
        uses: actions/checkout@v4
        with:
          path: public-tests
          persist-credentials: false
      - name: Checkout current public Android Satellite branch
        uses: actions/checkout@v4
        with:
          repository: cruefan94/Flipper-AI-Android-Satellite
          ref: develop/android-apk-build
          path: android-current
          persist-credentials: false
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone private Flipper protocol source into runner temp only
        env:
          PRIVATE_TOKEN: ${{ secrets.FLIPPER_PRIVATE_SOURCE_TOKEN }}
          PRIVATE_REF: ${{ matrix.private_ref }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Never include the credential in a command-line URL, artifact or log.
          printf 'machine github.com login x-access-token password %s\n' "$PRIVATE_TOKEN" > "$RUNNER_TEMP/.netrc"
          chmod 600 "$RUNNER_TEMP/.netrc"
          export HOME="$RUNNER_TEMP"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0=
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/bin/false
          trap 'rm -f "$RUNNER_TEMP/.netrc"' EXIT
          git -c http.extraheader= clone --quiet --depth 1 \
            --branch "$PRIVATE_REF" \
            https://github.com/cruefan94/Flipper-AI-Momentum-.git \
            "$RUNNER_TEMP/private-flipper"
          test -s "$RUNNER_TEMP/private-flipper/tests/integration/test_c_java_protocol.py"
          test -s "$GITHUB_WORKSPACE/android-current/android_satellite/app/src/main/java/com/flipperai/satellite/SatelliteRequestHandler.java"
      - name: Validate private Momentum BLE-first UI and transport guards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s "$RUNNER_TEMP/private-flipper/tests" \
            -p 'test_ble_ui_guards.py' -v
      - name: Audit GATT UUID and secure transport contract across both repositories
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/public-tests/scripts/check_cross_repository_gatt.py" \
            "$RUNNER_TEMP/private-flipper" "$GITHUB_WORKSPACE/android-current"
      - name: Test private Flipper C against actual public Android Java source
        shell: bash
        run: |
          set -euo pipefail
          # Use C and fixtures from temporary PRIVATE checkout, but Java ONLY
          # from the current separately checked-out PUBLIC Android repository.
          python3 "$GITHUB_WORKSPACE/public-tests/scripts/run_cross_repository_ai1.py" \
            "$RUNNER_TEMP/private-flipper" "$GITHUB_WORKSPACE/android-current"
          echo "HOST-ONLY PASS: physical BLE, CCCD, MTU, and AI inference still untested"
