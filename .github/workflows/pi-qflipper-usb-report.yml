name: Pi qFlipper USB inventory offline tests
on:
  push:
    branches:
      - 'pi/qflipper-usb-report-ci-*'
  pull_request:
    paths:
      - 'pi_lab/qflipper_usb_evidence.py'
      - 'pi_lab/qflipper_usb_report.py'
      - 'pi_lab/test_qflipper_usb_report.py'
      - '.github/workflows/pi-qflipper-usb-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-usb-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax check (no device access)
        run: python3 -m py_compile pi_lab/qflipper_usb_evidence.py pi_lab/qflipper_usb_report.py pi_lab/test_qflipper_usb_report.py
      - name: Offline regression suite
        run: python3 -m unittest -v pi_lab.test_qflipper_usb_report
