name: Lab ESP32 coexistence offline checks
on:
  push:
    branches:
      - lab/esp32-coexistence-offline-20261121-0524
  pull_request:
    paths:
      - lab/esp32_coexistence_plan.py
      - .github/workflows/lab-esp32-coexistence.yml
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run offline synthetic tests
        run: |
          python -m py_compile lab/esp32_coexistence_plan.py
          python lab/esp32_coexistence_plan.py --self-test
