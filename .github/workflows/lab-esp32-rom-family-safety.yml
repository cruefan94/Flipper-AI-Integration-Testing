name: Lab ESP32 ROM family safety
on:
  push:
    branches:
      - lab/esp32-rom-family-safety-20261120-1926
  pull_request:
    paths:
      - lab/esp32_rom_family_safety.py
      - .github/workflows/lab-esp32-rom-family-safety.yml
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline ROM family regression tests
        run: python3 lab/esp32_rom_family_safety.py -v
